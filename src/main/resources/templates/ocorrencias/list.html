<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ocorrências</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex">
<aside class="w-64 min-h-screen bg-white shadow-sm flex flex-col">
  <div class="p-6 border-b"><h1 class="text-xl font-bold text-indigo-700">Condomínio Admin</h1></div>
  <nav class="p-4 flex-1 space-y-1">
    <a href="/" class="flex items-center gap-2 px-3 py-2 rounded-lg text-gray-600 hover:bg-gray-100 font-medium text-sm">🏠 Início</a>
    <a href="/unidades" class="flex items-center gap-2 px-3 py-2 rounded-lg text-gray-600 hover:bg-gray-100 font-medium text-sm">🏢 Unidades</a>
    <a href="/moradores" class="flex items-center gap-2 px-3 py-2 rounded-lg text-gray-600 hover:bg-gray-100 font-medium text-sm">👤 Moradores</a>
    <a href="/visitantes" class="flex items-center gap-2 px-3 py-2 rounded-lg text-gray-600 hover:bg-gray-100 font-medium text-sm">🚶 Visitantes</a>
    <a href="/reservas" class="flex items-center gap-2 px-3 py-2 rounded-lg text-gray-600 hover:bg-gray-100 font-medium text-sm">📅 Reservas</a>
    <a href="/ocorrencias" class="flex items-center gap-2 px-3 py-2 rounded-lg bg-indigo-50 text-indigo-700 font-medium text-sm">⚠️ Ocorrências</a>
  </nav>
</aside>
<main class="flex-1 p-8">
  <div class="flex justify-between items-center mb-6">
    <h2 class="text-2xl font-bold text-gray-800">Ocorrências</h2>
    <a href="/ocorrencias/new" class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-indigo-700">+ Nova Ocorrência</a>
  </div>
  <div th:if="${successMessage}" class="mb-4 bg-green-50 border border-green-200 text-green-800 px-4 py-3 rounded-lg text-sm" th:text="${successMessage}"></div>
  <div th:if="${errorMessage}" class="mb-4 bg-red-50 border border-red-200 text-red-800 px-4 py-3 rounded-lg text-sm" th:text="${errorMessage}"></div>
  <div class="bg-white rounded-lg shadow-sm overflow-hidden">
    <table class="w-full">
      <thead class="bg-gray-50 border-b">
        <tr>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Título</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Tipo</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Prioridade</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Status</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Abertura</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Unidade</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Ações</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="o : ${ocorrencias}" class="border-b hover:bg-gray-50">
          <td class="px-6 py-4 text-sm font-medium text-gray-800" th:text="${o.titulo}"></td>
          <td class="px-6 py-4 text-sm text-gray-600" th:text="${o.tipo?.descricao}"></td>
          <td class="px-6 py-4 text-sm">
            <span th:text="${o.prioridade?.descricao}"
                  th:classappend="${o.prioridade?.name() == 'ALTA'} ? 'bg-red-100 text-red-800' : (${o.prioridade?.name() == 'MEDIA'} ? 'bg-yellow-100 text-yellow-800' : 'bg-gray-100 text-gray-600')"
                  class="px-2 py-1 rounded-full text-xs font-medium"></span>
          </td>
          <td class="px-6 py-4 text-sm">
            <span th:text="${o.status?.descricao}" class="px-2 py-1 rounded-full text-xs font-medium bg-blue-100 text-blue-800"></span>
          </td>
          <td class="px-6 py-4 text-sm text-gray-600" th:text="${#temporals.format(o.dataAbertura, 'dd/MM/yyyy HH:mm')}"></td>
          <td class="px-6 py-4 text-sm text-gray-600" th:text="${o.unidade?.identificacao}"></td>
          <td class="px-6 py-4 text-sm flex gap-2">
            <a th:href="@{/ocorrencias/{id}/edit(id=${o.id})}" class="text-indigo-600 hover:text-indigo-900 font-medium">Editar</a>
            <form th:action="@{/ocorrencias/{id}/delete(id=${o.id})}" method="post" onsubmit="return confirm('Confirmar exclusão?')">
              <button type="submit" class="text-red-600 hover:text-red-900 font-medium">Excluir</button>
            </form>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(ocorrencias)}">
          <td colspan="7" class="px-6 py-8 text-center text-gray-400 text-sm">Nenhuma ocorrência cadastrada.</td>
        </tr>
      </tbody>
    </table>
  </div>
</main>
</body>
</html>
