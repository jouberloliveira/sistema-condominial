<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login — Condomínio</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center">

<div class="w-full max-w-sm">
    <div class="bg-white rounded-2xl shadow-lg p-8">
        <div class="text-center mb-8">
            <div class="text-4xl mb-2">🏢</div>
            <h1 class="text-2xl font-bold text-slate-800">Condomínio</h1>
            <p class="text-slate-500 text-sm mt-1">Sistema de Gestão</p>
        </div>

        <div th:if="${param.error}"
             class="mb-4 p-3 bg-red-50 border border-red-200 rounded-lg text-red-700 text-sm">
            Usuário ou senha inválidos.
        </div>

        <div th:if="${param.logout}"
             class="mb-4 p-3 bg-green-50 border border-green-200 rounded-lg text-green-700 text-sm">
            Você saiu com sucesso.
        </div>

        <form th:action="@{/login}" method="post" class="space-y-4">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div>
                <label for="username" class="block text-sm font-medium text-slate-700 mb-1">Usuário</label>
                <input id="username" name="username" type="text" required autofocus
                       class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                       placeholder="seu.usuario"/>
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Senha</label>
                <input id="password" name="password" type="password" required
                       class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                       placeholder="••••••••"/>
            </div>

            <button type="submit"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 px-4 rounded-lg text-sm transition-colors">
                Entrar
            </button>
        </form>
    </div>
</div>

</body>
</html>
