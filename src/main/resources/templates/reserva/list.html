<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reservas</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex">
<aside class="w-64 min-h-screen bg-white shadow-sm flex flex-col">
  <div class="p-6 border-b"><h1 class="text-xl font-bold text-indigo-700">Condomínio Admin</h1></div>
  <nav class="p-4 flex-1 space-y-1">
    <a href="/" class="flex items-center gap-2 px-3 py-2 rounded-lg text-gray-600 hover:bg-gray-100 font-medium text-sm">🏠 Início</a>
    <a href="/unidades" class="flex items-center gap-2 px-3 py-2 rounded-lg text-gray-600 hover:bg-gray-100 font-medium text-sm">🏢 Unidades</a>
    <a href="/moradores" class="flex items-center gap-2 px-3 py-2 rounded-lg text-gray-600 hover:bg-gray-100 font-medium text-sm">👤 Moradores</a>
    <a href="/visitantes" class="flex items-center gap-2 px-3 py-2 rounded-lg text-gray-600 hover:bg-gray-100 font-medium text-sm">🚶 Visitantes</a>
    <a href="/reservas" class="flex items-center gap-2 px-3 py-2 rounded-lg bg-indigo-50 text-indigo-700 font-medium text-sm">📅 Reservas</a>
    <a href="/ocorrencias" class="flex items-center gap-2 px-3 py-2 rounded-lg text-gray-600 hover:bg-gray-100 font-medium text-sm">⚠️ Ocorrências</a>
  </nav>
</aside>
<main class="flex-1 p-8">
  <div class="flex justify-between items-center mb-6">
    <h2 class="text-2xl font-bold text-gray-800">Reservas de Área Comum</h2>
    <a href="/reservas/novo" class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-indigo-700">+ Nova Reserva</a>
  </div>
  <div th:if="${sucesso}" class="mb-4 bg-green-50 border border-green-200 text-green-800 px-4 py-3 rounded-lg text-sm" th:text="${sucesso}"></div>
  <div th:if="${erro}" class="mb-4 bg-red-50 border border-red-200 text-red-800 px-4 py-3 rounded-lg text-sm" th:text="${erro}"></div>
  <div class="bg-white rounded-lg shadow-sm overflow-hidden">
    <table class="w-full">
      <thead class="bg-gray-50 border-b">
        <tr>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Unidade</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Solicitante</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Área</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Início</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Fim</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Status</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Ações</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="r : ${reservas}" class="border-b hover:bg-gray-50">
          <td class="px-6 py-4 text-sm text-gray-600" th:text="${r.unidade?.identificacao}"></td>
          <td class="px-6 py-4 text-sm font-medium text-gray-800" th:text="${r.solicitante?.nome}"></td>
          <td class="px-6 py-4 text-sm text-gray-600" th:text="${r.area?.descricao}"></td>
          <td class="px-6 py-4 text-sm text-gray-600" th:text="${#temporals.format(r.inicio, 'dd/MM/yyyy HH:mm')}"></td>
          <td class="px-6 py-4 text-sm text-gray-600" th:text="${#temporals.format(r.fim, 'dd/MM/yyyy HH:mm')}"></td>
          <td class="px-6 py-4 text-sm">
            <span th:text="${r.status?.descricao}"
                  th:classappend="${r.status?.name() == 'APROVADA'} ? 'bg-green-100 text-green-800' :
                                  (${r.status?.name() == 'CANCELADA'} ? 'bg-red-100 text-red-800' :
                                  (${r.status?.name() == 'CONCLUIDA'} ? 'bg-blue-100 text-blue-800' : 'bg-yellow-100 text-yellow-800'))"
                  class="px-2 py-1 rounded-full text-xs font-medium"></span>
          </td>
          <td class="px-6 py-4 text-sm flex gap-2">
            <a th:href="@{/reservas/{id}(id=${r.id})}" class="text-blue-600 hover:text-blue-900 font-medium">Ver</a>
            <a th:href="@{/reservas/{id}/editar(id=${r.id})}" class="text-indigo-600 hover:text-indigo-900 font-medium">Editar</a>
            <form th:action="@{/reservas/{id}/excluir(id=${r.id})}" method="post" onsubmit="return confirm('Confirmar exclusão?')">
              <button type="submit" class="text-red-600 hover:text-red-900 font-medium">Excluir</button>
            </form>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(reservas)}">
          <td colspan="7" class="px-6 py-8 text-center text-gray-400 text-sm">Nenhuma reserva cadastrada.</td>
        </tr>
      </tbody>
    </table>
  </div>
</main>
</body>
</html>
