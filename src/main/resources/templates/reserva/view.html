<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Detalhe da Reserva</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex">
<aside class="w-64 min-h-screen bg-white shadow-sm flex flex-col">
  <div class="p-6 border-b"><h1 class="text-xl font-bold text-indigo-700">Condomínio Admin</h1></div>
  <nav class="p-4 flex-1 space-y-1">
    <a href="/" class="flex items-center gap-2 px-3 py-2 rounded-lg text-gray-600 hover:bg-gray-100 font-medium text-sm">🏠 Início</a>
    <a href="/unidades" class="flex items-center gap-2 px-3 py-2 rounded-lg text-gray-600 hover:bg-gray-100 font-medium text-sm">🏢 Unidades</a>
    <a href="/moradores" class="flex items-center gap-2 px-3 py-2 rounded-lg text-gray-600 hover:bg-gray-100 font-medium text-sm">👤 Moradores</a>
    <a href="/visitantes" class="flex items-center gap-2 px-3 py-2 rounded-lg text-gray-600 hover:bg-gray-100 font-medium text-sm">🚶 Visitantes</a>
    <a href="/reservas" class="flex items-center gap-2 px-3 py-2 rounded-lg bg-indigo-50 text-indigo-700 font-medium text-sm">📅 Reservas</a>
    <a href="/ocorrencias" class="flex items-center gap-2 px-3 py-2 rounded-lg text-gray-600 hover:bg-gray-100 font-medium text-sm">⚠️ Ocorrências</a>
  </nav>
</aside>
<main class="flex-1 p-8">
  <div class="max-w-lg">
    <div class="flex items-center gap-3 mb-6">
      <a href="/reservas" class="text-gray-400 hover:text-gray-600">← Voltar</a>
      <h2 class="text-2xl font-bold text-gray-800">Detalhes da Reserva</h2>
    </div>
    <div class="bg-white rounded-lg shadow-sm p-6 space-y-4">
      <div class="grid grid-cols-2 gap-4">
        <div>
          <p class="text-xs text-gray-500 uppercase font-medium">Unidade</p>
          <p class="text-sm text-gray-800 mt-1" th:text="${reserva.unidade?.identificacao}"></p>
        </div>
        <div>
          <p class="text-xs text-gray-500 uppercase font-medium">Solicitante</p>
          <p class="text-sm text-gray-800 mt-1" th:text="${reserva.solicitante?.nome}"></p>
        </div>
        <div>
          <p class="text-xs text-gray-500 uppercase font-medium">Área</p>
          <p class="text-sm text-gray-800 mt-1" th:text="${reserva.area?.descricao}"></p>
        </div>
        <div>
          <p class="text-xs text-gray-500 uppercase font-medium">Status</p>
          <span th:text="${reserva.status?.descricao}"
                class="inline-block mt-1 px-2 py-1 rounded-full text-xs font-medium bg-blue-100 text-blue-800"></span>
        </div>
        <div>
          <p class="text-xs text-gray-500 uppercase font-medium">Início</p>
          <p class="text-sm text-gray-800 mt-1" th:text="${#temporals.format(reserva.inicio, 'dd/MM/yyyy HH:mm')}"></p>
        </div>
        <div>
          <p class="text-xs text-gray-500 uppercase font-medium">Fim</p>
          <p class="text-sm text-gray-800 mt-1" th:text="${#temporals.format(reserva.fim, 'dd/MM/yyyy HH:mm')}"></p>
        </div>
      </div>
      <div th:if="${reserva.observacao}">
        <p class="text-xs text-gray-500 uppercase font-medium">Observação</p>
        <p class="text-sm text-gray-800 mt-1" th:text="${reserva.observacao}"></p>
      </div>
      <div class="flex gap-3 pt-2 border-t">
        <a th:href="@{/reservas/{id}/editar(id=${reserva.id})}"
           class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-indigo-700">Editar</a>
        <form th:action="@{/reservas/{id}/excluir(id=${reserva.id})}" method="post"
              onsubmit="return confirm('Confirmar exclusão?')">
          <button type="submit" class="bg-red-50 text-red-700 px-4 py-2 rounded-lg text-sm font-medium hover:bg-red-100">Excluir</button>
        </form>
      </div>
    </div>
  </div>
</main>
</body>
</html>
